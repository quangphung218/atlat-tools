name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m compileall -q atlat_tools
      - run: python -m unittest discover -s tests -v
      - run: pip install . && agent-lint --help >/dev/null && claude-observe --help >/dev/null && claude-skills --help >/dev/null && recall --help >/dev/null
