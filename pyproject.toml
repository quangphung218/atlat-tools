[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlat-tools"
version = "0.3.2"
description = "Dependency-free CLIs for people who run coding agents on their own machine: lint agent configs, see what you really use, manage skills, search your memory, verify shipped features in logs, watch host health, lint Vietnamese voice, prune merged branches."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Quang Phung" }]
keywords = ["claude-code", "agents", "skills", "lint", "fts5", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/quangphung218/atlat-tools"

[project.scripts]
agent-lint = "atlat_tools.agent_lint:main"
claude-observe = "atlat_tools.claude_observe:main"
claude-skills = "atlat_tools.claude_skills:main"
recall = "atlat_tools.recall:main"
logexpect = "atlat_tools.logexpect:main"
agent-health = "atlat_tools.agent_health:main"
vn-style = "atlat_tools.vn_style:main"
git-prune-merged = "atlat_tools.git_prune_merged:main"

[tool.setuptools]
packages = ["atlat_tools"]
