[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlat-tools"
version = "0.1.0"
description = "Small, dependency-free CLIs for people who run coding agents on their own machine: lint agent configs, see what you really use, manage skills, search your memory."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Quang Phung" }]
keywords = ["claude-code", "agents", "skills", "lint", "fts5", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/quangphung218/atlat-tools"

[project.scripts]
agent-lint = "atlat_tools.agent_lint:main"
claude-observe = "atlat_tools.claude_observe:main"
claude-skills = "atlat_tools.claude_skills:main"
recall = "atlat_tools.recall:main"

[tool.setuptools]
packages = ["atlat_tools"]
